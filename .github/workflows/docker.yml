name: Docker

on:
  pull_request:
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "test/**"
      - "scripts/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_version:
        description: "Release version without the v prefix (for example 1.0.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_CODEX_IMAGE_NAME: ${{ vars.DOCKERHUB_CODEX_IMAGE_NAME || 'task-handoff-controlled-codex' }}
  DOCKERHUB_OBSCURA_IMAGE_NAME: ${{ vars.DOCKERHUB_OBSCURA_IMAGE_NAME || 'task-handoff-controlled-obscura' }}
  DOCKERHUB_OPENCODE_IMAGE_NAME: ${{ vars.DOCKERHUB_OPENCODE_IMAGE_NAME || 'task-handoff-controlled-opencode' }}
  DOCKERHUB_AI_IMAGE_NAME: ${{ vars.DOCKERHUB_AI_IMAGE_NAME || 'task-handoff-controlled-ai' }}
  DOCKERHUB_WEBCAP_IMAGE_NAME: ${{ vars.DOCKERHUB_WEBCAP_IMAGE_NAME || 'task-handoff-controlled-webcap' }}
  DOCKERHUB_BCAP_IMAGE_NAME: ${{ vars.DOCKERHUB_BCAP_IMAGE_NAME || 'task-handoff-controlled-bcap' }}
  DOCKERHUB_BROWSER_IMAGE_NAME: ${{ vars.DOCKERHUB_BROWSER_IMAGE_NAME || 'task-handoff-controlled-browser' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.profiles.outputs.profiles }}
      profiles_space: ${{ steps.profiles.outputs.profiles_space }}
      initial_profiles: ${{ steps.profiles.outputs.initial_profiles }}
      has_profiles: ${{ steps.profiles.outputs.has_profiles }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify image repository contracts
        run: node --test test/*.test.js

      - uses: docker/setup-buildx-action@v4
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.image_version != '' }}

      - name: Login to Docker Hub for latest-tag discovery
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.image_version != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve affected image profiles
        id: profiles
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.image_version != '' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" ]]; then
            base="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          fi
          profiles="$(node scripts/resolve-changed-image-profiles.mjs --base "$base" --head "$GITHUB_SHA")"
          initial_profiles="[]"

          if [[ "$IS_RELEASE" == true ]]; then
            for entry in \
              "codex:${DOCKERHUB_CODEX_IMAGE_NAME}" \
              "obscura:${DOCKERHUB_OBSCURA_IMAGE_NAME}" \
              "opencode:${DOCKERHUB_OPENCODE_IMAGE_NAME}" \
              "ai:${DOCKERHUB_AI_IMAGE_NAME}" \
              "webcap:${DOCKERHUB_WEBCAP_IMAGE_NAME}" \
              "bcap:${DOCKERHUB_BCAP_IMAGE_NAME}" \
              "browser:${DOCKERHUB_BROWSER_IMAGE_NAME}"
            do
              profile="${entry%%:*}"
              image_name="${entry#*:}"
              image="${DOCKERHUB_USERNAME}/${image_name}:latest"
              if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                echo "No latest tag found for ${image}; scheduling its initial build."
                initial_profiles="$(node -e '
                  const profiles = new Set(JSON.parse(process.argv[1]));
                  profiles.add(process.argv[2]);
                  const order = ["codex", "obscura", "opencode", "ai", "webcap", "bcap", "browser"];
                  process.stdout.write(JSON.stringify(order.filter((profile) => profiles.has(profile))));
                ' "$initial_profiles" "$profile")"
                profiles="$(node -e '
                  const profiles = new Set(JSON.parse(process.argv[1]));
                  profiles.add(process.argv[2]);
                  const order = ["codex", "obscura", "opencode", "ai", "webcap", "bcap", "browser"];
                  process.stdout.write(JSON.stringify(order.filter((profile) => profiles.has(profile))));
                ' "$profiles" "$profile")"
              fi
            done
          fi

          profiles_space="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).join(" "))' "$profiles")"
          if [[ "$profiles" == "[]" ]]; then has_profiles=false; else has_profiles=true; fi
          echo "Affected profiles: ${profiles_space:-none}"
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"
          echo "profiles_space=$profiles_space" >> "$GITHUB_OUTPUT"
          echo "initial_profiles=$initial_profiles" >> "$GITHUB_OUTPUT"
          echo "has_profiles=$has_profiles" >> "$GITHUB_OUTPUT"

  docker-build:
    if: ${{ needs.detect-changes.outputs.has_profiles == 'true' }}
    needs: detect-changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image version
        id: image-version
        env:
          REQUESTED_IMAGE_VERSION: ${{ inputs.image_version }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1])) process.exit(1)' "$version"
            tag="v${version}"
          elif [[ -n "${REQUESTED_IMAGE_VERSION}" ]]; then
            version="${REQUESTED_IMAGE_VERSION}"
            node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1])) process.exit(1)' "$version"
            tag="v${version}"
          else
            version="ci-${GITHUB_SHA::7}"
            tag="ci-${GITHUB_SHA::7}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "codex-image-ref=${DOCKERHUB_CODEX_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "obscura-image-ref=${DOCKERHUB_OBSCURA_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "opencode-image-ref=${DOCKERHUB_OPENCODE_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "ai-image-ref=${DOCKERHUB_AI_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "webcap-image-ref=${DOCKERHUB_WEBCAP_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "bcap-image-ref=${DOCKERHUB_BCAP_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "browser-image-ref=${DOCKERHUB_BROWSER_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build Codex image
        if: ${{ contains(fromJSON(needs.detect-changes.outputs.profiles), 'codex') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: profile-codex
          tags: task-handoff-controlled-codex:ci-${{ matrix.arch }}
          build-args: |
            TASK_HANDOFF_IMAGE_VERSION=${{ steps.image-version.outputs.value }}
            TASK_HANDOFF_BUILD_ID=${{ github.run_id }}
            TASK_HANDOFF_BUILT_AT=${{ github.event.repository.updated_at }}
            TASK_HANDOFF_GIT_COMMIT=${{ github.sha }}
            TASK_HANDOFF_IMAGE_REF=${{ steps.image-version.outputs.codex-image-ref }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Build OpenCode image
        if: ${{ contains(fromJSON(needs.detect-changes.outputs.profiles), 'opencode') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: profile-opencode
          tags: task-handoff-controlled-opencode:ci-${{ matrix.arch }}
          build-args: |
            TASK_HANDOFF_IMAGE_VERSION=${{ steps.image-version.outputs.value }}
            TASK_HANDOFF_BUILD_ID=${{ github.run_id }}
            TASK_HANDOFF_BUILT_AT=${{ github.event.repository.updated_at }}
            TASK_HANDOFF_GIT_COMMIT=${{ github.sha }}
            TASK_HANDOFF_IMAGE_REF=${{ steps.image-version.outputs.opencode-image-ref }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Build Obscura image
        if: ${{ contains(fromJSON(needs.detect-changes.outputs.profiles), 'obscura') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: profile-obscura
          tags: task-handoff-controlled-obscura:ci-${{ matrix.arch }}
          build-args: |
            TASK_HANDOFF_IMAGE_VERSION=${{ steps.image-version.outputs.value }}
            TASK_HANDOFF_BUILD_ID=${{ github.run_id }}
            TASK_HANDOFF_BUILT_AT=${{ github.event.repository.updated_at }}
            TASK_HANDOFF_GIT_COMMIT=${{ github.sha }}
            TASK_HANDOFF_IMAGE_REF=${{ steps.image-version.outputs.obscura-image-ref }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Build AI image
        if: ${{ contains(fromJSON(needs.detect-changes.outputs.profiles), 'ai') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: profile-ai
          tags: task-handoff-controlled-ai:ci-${{ matrix.arch }}
          build-args: |
            TASK_HANDOFF_IMAGE_VERSION=${{ steps.image-version.outputs.value }}
            TASK_HANDOFF_BUILD_ID=${{ github.run_id }}
            TASK_HANDOFF_BUILT_AT=${{ github.event.repository.updated_at }}
            TASK_HANDOFF_GIT_COMMIT=${{ github.sha }}
            TASK_HANDOFF_IMAGE_REF=${{ steps.image-version.outputs.ai-image-ref }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Build WebCap image
        if: ${{ contains(fromJSON(needs.detect-changes.outputs.profiles), 'webcap') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: profile-webcap
          tags: task-handoff-controlled-webcap:ci-${{ matrix.arch }}
          build-args: |
            TASK_HANDOFF_IMAGE_VERSION=${{ steps.image-version.outputs.value }}
            TASK_HANDOFF_BUILD_ID=${{ github.run_id }}
            TASK_HANDOFF_BUILT_AT=${{ github.event.repository.updated_at }}
            TASK_HANDOFF_GIT_COMMIT=${{ github.sha }}
            TASK_HANDOFF_IMAGE_REF=${{ steps.image-version.outputs.webcap-image-ref }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Build BCap image
        if: ${{ contains(fromJSON(needs.detect-changes.outputs.profiles), 'bcap') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: profile-bcap
          tags: task-handoff-controlled-bcap:ci-${{ matrix.arch }}
          build-args: |
            TASK_HANDOFF_IMAGE_VERSION=${{ steps.image-version.outputs.value }}
            TASK_HANDOFF_BUILD_ID=${{ github.run_id }}
            TASK_HANDOFF_BUILT_AT=${{ github.event.repository.updated_at }}
            TASK_HANDOFF_GIT_COMMIT=${{ github.sha }}
            TASK_HANDOFF_IMAGE_REF=${{ steps.image-version.outputs.bcap-image-ref }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Build Browser image
        if: ${{ contains(fromJSON(needs.detect-changes.outputs.profiles), 'browser') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          target: profile-browser
          tags: task-handoff-controlled-browser:ci-${{ matrix.arch }}
          build-args: |
            TASK_HANDOFF_IMAGE_VERSION=${{ steps.image-version.outputs.value }}
            TASK_HANDOFF_BUILD_ID=${{ github.run_id }}
            TASK_HANDOFF_BUILT_AT=${{ github.event.repository.updated_at }}
            TASK_HANDOFF_GIT_COMMIT=${{ github.sha }}
            TASK_HANDOFF_IMAGE_REF=${{ steps.image-version.outputs.browser-image-ref }}
          cache-from: type=gha,scope=docker-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.arch }}

      - name: Verify image metadata and controlled-instance absence
        env:
          EXPECTED_VERSION: ${{ steps.image-version.outputs.value }}
        run: |
          set -euo pipefail
          mapfile -t profiles < <(node -e 'for (const profile of JSON.parse(process.argv[1])) console.log(profile)' '${{ needs.detect-changes.outputs.profiles }}')
          for profile in "${profiles[@]}"; do
            image="task-handoff-controlled-${profile}:ci-${{ matrix.arch }}"
            actual="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            declared_profile="$(docker image inspect "$image" --format '{{ index .Config.Labels "io.task-handoff.image.profile" }}')"
            test "$actual" = "$EXPECTED_VERSION"
            test "$declared_profile" = "$profile"
          done

      - name: Smoke test profile environments without embedded runtime
        if: ${{ matrix.arch == 'amd64' }}
        shell: bash
        run: |
          set -euo pipefail
          containers=()
          cleanup() {
            if ((${#containers[@]})); then docker rm -f "${containers[@]}" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT

          run_profile() {
            local profile="$1"
            shift
            local name="task-handoff-${profile}-ci"
            containers+=("$name")
            docker run -d --name "$name" "task-handoff-controlled-${profile}:ci-amd64" >/dev/null
            for i in $(seq 1 30); do
              state="$(docker inspect --format '{{.State.Running}}' "$name" 2>/dev/null || true)"
              if [ "$state" = true ] && docker logs "$name" 2>&1 | grep -q 'No controlled-instance runtime is active'; then
                break
              fi
              if [ "$i" = 30 ]; then docker logs "$name"; exit 1; fi
              sleep 1
            done
            test "$(docker exec "$name" id -un)" = agent
            test "$(docker exec "$name" sudo -n id -u)" = 0
            test "$(docker exec "$name" sh -lc 'test ! -e /usr/local/bin/task-handoff-controlled-instance && echo absent')" = absent
            test "$(docker exec "$name" sh -lc 'test ! -e /usr/local/lib/node_modules/@task-handoff/controlled-instance && echo absent')" = absent
            for command in "$@"; do docker exec "$name" sh -lc "command -v '$command'" >/dev/null; done
          }

          mapfile -t profiles < <(node -e 'for (const profile of JSON.parse(process.argv[1])) console.log(profile)' '${{ needs.detect-changes.outputs.profiles }}')
          for profile in "${profiles[@]}"; do
            case "$profile" in
              codex)
                run_profile codex codex
                ! docker exec task-handoff-codex-ci sh -lc 'command -v claude'
                ! docker exec task-handoff-codex-ci sh -lc 'command -v chromium'
                ;;
              obscura)
                run_profile obscura codex obscura obscura-worker
                docker exec task-handoff-obscura-ci obscura --version
                ! docker exec task-handoff-obscura-ci sh -lc 'command -v claude'
                ;;
              opencode)
                run_profile opencode opencode
                ! docker exec task-handoff-opencode-ci sh -lc 'command -v codex'
                ! docker exec task-handoff-opencode-ci sh -lc 'command -v claude'
                ;;
              ai)
                run_profile ai codex claude
                ! docker exec task-handoff-ai-ci sh -lc 'command -v chromium'
                ;;
              webcap)
                run_profile webcap codex claude chromium vncserver web-cap
                ! docker exec task-handoff-webcap-ci sh -lc 'command -v code-server'
                ;;
              bcap)
                run_profile bcap codex claude chromium vncserver
                docker exec task-handoff-bcap-ci sh -lc 'test -f /home/agent/.codex/skills/bcap/SKILL.md'
                docker exec task-handoff-bcap-ci sh -lc 'test -f /home/agent/.agents/skills/bcap/SKILL.md'
                docker exec task-handoff-bcap-ci sh -lc 'test -f /home/agent/.claude/skills/bcap/SKILL.md'
                docker exec task-handoff-bcap-ci sh -lc 'test -d /home/agent/.codex/skills/bcap/node_modules/playwright-core'
                docker exec --user agent task-handoff-bcap-ci node /home/agent/.codex/skills/bcap/scripts/bcap.mjs --help >/dev/null
                ! docker exec task-handoff-bcap-ci sh -lc 'command -v code-server'
                ! docker exec task-handoff-bcap-ci sh -lc 'command -v web-cap'
                ;;
              browser)
                run_profile browser codex claude chromium vncserver code-server
                ! docker exec task-handoff-browser-ci sh -lc 'command -v web-cap'
                ;;
            esac
          done

      - name: Cleanup
        if: ${{ always() && matrix.arch == 'amd64' }}
        run: docker rm -f task-handoff-codex-ci task-handoff-obscura-ci task-handoff-opencode-ci task-handoff-ai-ci task-handoff-webcap-ci task-handoff-bcap-ci task-handoff-browser-ci 2>/dev/null || true

      - name: Resolve published TaskHandoff compatibility versions
        if: ${{ matrix.arch == 'amd64' }}
        id: task-handoff-versions
        run: node scripts/resolve-task-handoff-versions.mjs

      - name: Test current and N-1 TaskHandoff compatibility
        if: ${{ matrix.arch == 'amd64' }}
        env:
          TASK_HANDOFF_VERSION_MATRIX: ${{ steps.task-handoff-versions.outputs.matrix }}
          TASK_HANDOFF_IMAGE_PROFILES: ${{ needs.detect-changes.outputs.profiles_space }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t versions < <(node -e 'for (const item of JSON.parse(process.env.TASK_HANDOFF_VERSION_MATRIX).include) console.log(item.version)')
          for version in "${versions[@]}"; do
            scripts/test-task-handoff-compatibility.sh "$version"
          done

      - name: Login to Docker Hub
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.image_version != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish immutable commit image
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.image_version != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          sha_tag="docker-sha-${GITHUB_SHA}-${{ matrix.arch }}"
          mapfile -t profiles < <(node -e 'for (const profile of JSON.parse(process.argv[1])) console.log(profile)' '${{ needs.detect-changes.outputs.profiles }}')
          for profile in "${profiles[@]}"; do
            case "$profile" in
              codex) image_name="$DOCKERHUB_CODEX_IMAGE_NAME" ;;
              obscura) image_name="$DOCKERHUB_OBSCURA_IMAGE_NAME" ;;
              opencode) image_name="$DOCKERHUB_OPENCODE_IMAGE_NAME" ;;
              ai) image_name="$DOCKERHUB_AI_IMAGE_NAME" ;;
              webcap) image_name="$DOCKERHUB_WEBCAP_IMAGE_NAME" ;;
              bcap) image_name="$DOCKERHUB_BCAP_IMAGE_NAME" ;;
              browser) image_name="$DOCKERHUB_BROWSER_IMAGE_NAME" ;;
            esac
            image="${DOCKERHUB_USERNAME}/${image_name}"
            if docker buildx imagetools inspect "${image}:${sha_tag}" >/dev/null 2>&1; then
              echo "Immutable image already exists; preserving ${image}:${sha_tag}."
              continue
            fi
            docker tag "task-handoff-controlled-${profile}:ci-${{ matrix.arch }}" "${image}:${sha_tag}"
            docker push "${image}:${sha_tag}"
          done

  publish-multiarch-image:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.image_version != '' }}
    needs: [detect-changes, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture commit image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          sha_tag="docker-sha-${GITHUB_SHA}"
          mapfile -t profiles < <(node -e 'for (const profile of JSON.parse(process.argv[1])) console.log(profile)' '${{ needs.detect-changes.outputs.profiles }}')
          for profile in "${profiles[@]}"; do
            case "$profile" in
              codex) image_name="$DOCKERHUB_CODEX_IMAGE_NAME" ;;
              obscura) image_name="$DOCKERHUB_OBSCURA_IMAGE_NAME" ;;
              opencode) image_name="$DOCKERHUB_OPENCODE_IMAGE_NAME" ;;
              ai) image_name="$DOCKERHUB_AI_IMAGE_NAME" ;;
              webcap) image_name="$DOCKERHUB_WEBCAP_IMAGE_NAME" ;;
              bcap) image_name="$DOCKERHUB_BCAP_IMAGE_NAME" ;;
              browser) image_name="$DOCKERHUB_BROWSER_IMAGE_NAME" ;;
            esac
            image="${DOCKERHUB_USERNAME}/${image_name}"
            if docker buildx imagetools inspect "${image}:${sha_tag}" >/dev/null 2>&1; then
              echo "Immutable multi-architecture image already exists; preserving ${image}:${sha_tag}."
              continue
            fi
            docker buildx imagetools create \
              --tag "${image}:${sha_tag}" \
              "${image}:${sha_tag}-amd64" \
              "${image}:${sha_tag}-arm64"
            docker buildx imagetools inspect "${image}:${sha_tag}"
          done

  promote-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.image_version != '' }}
    needs: [detect-changes, publish-multiarch-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote immutable image to Docker release tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REQUESTED_IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v${REQUESTED_IMAGE_VERSION}"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Docker release tag is not a supported semantic version: $version"
            exit 1
          fi

          release_version="${version#v}"
          if [[ "$release_version" == *-* ]]; then
            prerelease="${release_version#*-}"
            channel="${prerelease%%.*}"
            if [[ "$channel" != "alpha" && "$channel" != "beta" ]]; then
              echo "::error::Only alpha and beta Docker prerelease channels are supported: $version"
              exit 1
            fi
          fi

          mapfile -t profiles < <(node -e 'for (const profile of JSON.parse(process.argv[1])) console.log(profile)' '${{ needs.detect-changes.outputs.profiles }}')
          mapfile -t initial_profiles < <(node -e 'for (const profile of JSON.parse(process.argv[1])) console.log(profile)' '${{ needs.detect-changes.outputs.initial_profiles }}')
          for profile in "${profiles[@]}"; do
            case "$profile" in
              codex) image_name="$DOCKERHUB_CODEX_IMAGE_NAME" ;;
              obscura) image_name="$DOCKERHUB_OBSCURA_IMAGE_NAME" ;;
              opencode) image_name="$DOCKERHUB_OPENCODE_IMAGE_NAME" ;;
              ai) image_name="$DOCKERHUB_AI_IMAGE_NAME" ;;
              webcap) image_name="$DOCKERHUB_WEBCAP_IMAGE_NAME" ;;
              bcap) image_name="$DOCKERHUB_BCAP_IMAGE_NAME" ;;
              browser) image_name="$DOCKERHUB_BROWSER_IMAGE_NAME" ;;
            esac
            image="${DOCKERHUB_USERNAME}/${image_name}"
            if docker buildx imagetools inspect "${image}:${version}" >/dev/null 2>&1; then
              echo "::error::Immutable Docker release already exists: ${image}:${version}"
              exit 1
            fi
          done

          for profile in "${profiles[@]}"; do
            case "$profile" in
              codex) image_name="$DOCKERHUB_CODEX_IMAGE_NAME" ;;
              obscura) image_name="$DOCKERHUB_OBSCURA_IMAGE_NAME" ;;
              opencode) image_name="$DOCKERHUB_OPENCODE_IMAGE_NAME" ;;
              ai) image_name="$DOCKERHUB_AI_IMAGE_NAME" ;;
              webcap) image_name="$DOCKERHUB_WEBCAP_IMAGE_NAME" ;;
              bcap) image_name="$DOCKERHUB_BCAP_IMAGE_NAME" ;;
              browser) image_name="$DOCKERHUB_BROWSER_IMAGE_NAME" ;;
            esac
            image="${DOCKERHUB_USERNAME}/${image_name}"
            source="${image}:docker-sha-${GITHUB_SHA}"
            tags=(--tag "${image}:${version}")
            if [[ "$release_version" != *-* ]]; then
              tags+=(--tag "${image}:latest")
            else
              tags+=(--tag "${image}:${channel}")
              for initial_profile in "${initial_profiles[@]}"; do
                if [[ "$profile" == "$initial_profile" ]]; then
                  tags+=(--tag "${image}:latest")
                  break
                fi
              done
            fi
            docker buildx imagetools create --prefer-index=false "${tags[@]}" "$source"
            docker buildx imagetools inspect "${image}:${version}"
          done

  publish-market-catalog:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.image_version != '' }}
    needs: promote-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: market-catalog-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate and deploy market catalog
        id: publish
        uses: ./.github/actions/publish-market-catalog
        with:
          namespace: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
          signing-key: ${{ secrets.TASK_HANDOFF_CATALOG_SIGNING_KEY }}
          signing-key-id: ${{ vars.TASK_HANDOFF_CATALOG_SIGNING_KEY_ID }}
